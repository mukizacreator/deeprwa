<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>Shared chat — DeepRWA</title>
<meta name="theme-color" content="#000000" />
<meta name="robots" content="noindex" />
<link rel="icon" href="/av.png" type="image/png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #000; --surface: #0a0a0a; --surface-2: #121212; --surface-3: #1a1a1a;
  --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.18);
  --text: #e6e8eb; --text-muted: #8b9199; --text-dim: #5c636d;
  --accent: #3b6ef5;
  --rwa-blue: #00a1de; --rwa-yellow: #fad201; --rwa-green: #20603d;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.24); }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; min-height: 100dvh;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
.header {
  padding: 1rem;
  padding-top: calc(1rem + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--text); touch-action: manipulation; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.brand-name { font-weight: 700; font-size: 1.02rem; display: inline-flex; align-items: baseline; }
.b-deep { color: var(--text); }
.b-r { color: var(--rwa-blue); }
.b-w { color: var(--rwa-yellow); }
.b-a { color: var(--rwa-green); }
.cta {
  background: var(--accent); color: #fff; text-decoration: none;
  padding: 0.7rem 1.1rem; border-radius: 999px;
  font-size: 0.85rem; font-weight: 600;
  min-height: 44px; display: inline-flex; align-items: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, transform 0.06s;
}
.cta:hover { background: #2f5ee0; }
.cta:active { transform: scale(0.96); }
.container {
  max-width: 760px; margin: 0 auto;
  padding: 1.5rem 1rem 4rem;
  padding-bottom: calc(4rem + env(safe-area-inset-bottom, 0px));
}
.shared-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 1.5rem; }
.msg { display: flex; margin-bottom: 1.5rem; }
.msg-user { justify-content: flex-end; flex-direction: column; align-items: flex-end; gap: 0.35rem; }
.msg-user .bubble { background: var(--surface-2); padding: 0.7rem 1rem; border-radius: 16px 16px 4px 16px; max-width: min(80%, 620px); line-height: 1.55; font-size: 0.94rem; border: 1px solid var(--border); word-wrap: break-word; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.msg-assistant { gap: 0.75rem; align-items: flex-start; }
.avatar { flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); margin-top: 2px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.assistant-body { flex: 1; min-width: 0; }
.assistant-name { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.3rem; }
.assistant-text { line-height: 1.65; font-size: 0.95rem; word-wrap: break-word; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.assistant-text p { margin: 0 0 0.75rem; }
.assistant-text p:last-child { margin-bottom: 0; }
.assistant-text strong { color: #fff; font-weight: 600; }
.assistant-text ul, .assistant-text ol { margin: 0 0 0.75rem 1.25rem; }
.assistant-text a { color: var(--accent); }
.assistant-text code { background: var(--surface); padding: 0.1rem 0.35rem; border-radius: 5px; font-family: ui-monospace, monospace; font-size: 0.86em; }
.assistant-text pre { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1rem; overflow-x: auto; margin: 0 0 0.75rem; font-size: 0.83rem; }
.assistant-text table { border-collapse: collapse; width: 100%; margin: 0 0 0.75rem; font-size: 0.88rem; display: block; overflow-x: auto; }
.assistant-text th, .assistant-text td { border: 1px solid var(--border); padding: 0.4rem 0.65rem; text-align: left; }
.msg-files { display: flex; flex-wrap: wrap; gap: 0.4rem; max-width: min(80%, 620px); justify-content: flex-end; }
.msg-file-thumb { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; transition: transform 0.15s; display: block; }
.msg-file-thumb:hover { transform: scale(1.02); }
.msg-file-doc { width: 90px; height: 90px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--text-muted); cursor: pointer; }
.msg-file-doc svg { width: 28px; height: 28px; }
.msg-files a { text-decoration: none; display: inline-block; }
.version-switcher { display: inline-flex; align-items: center; gap: 0.3rem; margin-top: 0.35rem; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 2px 6px; font-size: 0.78rem; color: var(--text-muted); }
.vs-btn {
  background: transparent; border: none; color: var(--text-muted);
  width: 40px; height: 40px; min-width: 40px; min-height: 40px;
  border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none; user-select: none;
  transition: background 0.15s, color 0.15s, transform 0.06s;
}
.vs-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.vs-btn:active:not(:disabled) { transform: scale(0.94); }
.vs-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.vs-btn svg { width: 14px; height: 14px; pointer-events: none; }
.vs-label { font-weight: 500; padding: 0 0.3rem; }
.error { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }

.generated-image-wrap {
  margin-top: 0.85rem;
  max-width: min(100%, 560px);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface);
  line-height: 0;
}
.generated-image {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 12px;
}
@media (max-width: 600px) {
  .generated-image-wrap { max-width: 100%; }
}
  
@media (max-width: 600px) {
  .msg-user .bubble { max-width: 90%; }
  .msg-files { max-width: 90%; }
  .msg-file-thumb { width: 90px; height: 90px; }
  .msg-file-doc { width: 72px; height: 72px; }
}
@media (hover: none) {
  .cta:hover { background: var(--accent); }
  .msg-file-thumb:hover { transform: none; }
  .vs-btn:hover:not(:disabled) { background: transparent; color: var(--text-muted); }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<header class="header">
  <a href="/" class="brand">
    <img src="/av.png" alt="DeepRWA" />
    <span class="brand-name"><span class="b-deep">Deep</span><span class="b-r">R</span><span class="b-w">W</span><span class="b-a">A</span></span>
  </a>
  <a href="/" class="cta">Open DeepRWA</a>
</header>
<div class="container" id="container">
  <div class="shared-title">Shared chat</div>
  <div id="content"><p style="color:var(--text-muted);">Loading…</p></div>
</div>

<script>
const state = { messages: [], versions: {} };

function escapeHtml(t) { return String(t || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function escapeHtmlOutsideCode(text) {
  const lines = (text || '').split('\n');
  let inCode = false;
  return lines.map(line => {
    if (/^\s*```/.test(line)) { inCode = !inCode; return line; }
    if (inCode) return line;

    let cleaned = line
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<hr\s*\/?>/gi, '\n')
      .replace(/<a\s+[^>]*?href\s*=\s*["']([^"']*)["'][^>]*?>(.*?)<\/a>/gi, '[$2]($1)')
      .replace(/<\/?(p|div|span|strong|em|b|i|u|ul|ol|li|blockquote|table|thead|tbody|tr|td|th|h[1-6]|section|article|header|footer|nav|aside|main|pre|code|sup|sub|small|mark|del|ins|figure|figcaption|picture|source|video|audio|canvas|iframe|form|input|button|select|textarea|label|fieldset|legend|details|summary|body|html|head|title|meta|link|script|style)[^>]*>/gi, '')
      .replace(/<!--[\s\S]*?-->/g, '');

    return cleaned.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }).join('\n');
}

function renderMarkdown(text) {
  const safe = escapeHtmlOutsideCode(text || '');
  let html;
  try {
    html = window.marked.parse(safe, { breaks: true, gfm: true });
  } catch {
    return safe.replace(/\n/g, '<br>');
  }

  html = html.replace(/<hr\s*\/?>/gi, '');

  html = html.replace(/<a\s+([^>]*?)>/gi, (_match, attrs) => {
    const cleanedAttrs = attrs
      .replace(/\btarget\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
      .replace(/\brel\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
      .trim();
    return `<a ${cleanedAttrs ? cleanedAttrs + ' ' : ''}target="_blank" rel="noopener noreferrer">`;
  });

  return html;
}

async function load() {
  const token = location.pathname.split('/').pop();
  try {
    const res = await fetch(`/api/share/${token}`);
    if (!res.ok) throw new Error('Share not found');
    const data = await res.json();
    state.messages = data.messages || [];

    state.messages.forEach((m, i) => {
      if (m.role === 'user' && m.versions && m.versions.length > 0) {
        state.versions[i] = {
          versions: m.versions,
          versionFiles: m.version_files || m.versionFiles || [],
          aiReplies: m.ai_replies || m.aiReplies || [],
          aiFiles: m.ai_files || m.aiFiles || [],
          currentIndex: m.current_version_index || m.currentVersionIndex || 0
        };
      }
    });
    render();
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="error">This share link is invalid or has expired.</div>`;
  }
}

function render() {
  const content = document.getElementById('content');
  if (!state.messages.length) {
    content.innerHTML = `<div class="error">Nothing to show.</div>`;
    return;
  }
  content.innerHTML = state.messages.map((m, i) => m.role === 'user' ? renderUser(m, i) : renderAssistant(m, i)).join('');
  if (window.lucide) window.lucide.createIcons();
}

function renderFilesInline(files) {
  if (!files || !files.length) return '';
  const normal = files.filter(f => !f.generated);
  const generated = files.filter(f => f.generated);
  let html = '';
  if (normal.length) {
    html += `<div class="msg-files">${normal.map(f => {
      const isImg = (f.type || '').startsWith('image/');
      const url = f.dataUrl || f.url || f.public_url || '';
      if (!url) return '';
      const inner = isImg
        ? `<img src="${url}" class="msg-file-thumb" loading="lazy" alt="attachment" />`
        : `<div class="msg-file-doc"><i data-lucide="file-text"></i></div>`;
      return `<a href="${url}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
    }).join('')}</div>`;
  }
  if (generated.length) {
    html += generated.map(f => {
      const url = f.public_url || f.url || f.dataUrl || '';
      if (!url) return '';
      return `<div class="generated-image-wrap"><img src="${url}" class="generated-image" loading="lazy" alt="Generated image" /></div>`;
    }).join('');
  }
  return html;
}

function renderUser(m, i) {
  const v = state.versions[i];
  const content = v ? v.versions[v.currentIndex] : m.content;
  const files = v ? v.versionFiles[v.currentIndex] : m.files;
  const switcher = v && v.versions.length > 1 ? `
    <div class="version-switcher">
      <button class="vs-btn" data-vs="prev" data-idx="${i}" ${v.currentIndex === 0 ? 'disabled' : ''} aria-label="Previous"><i data-lucide="chevron-left"></i></button>
      <span class="vs-label">${v.currentIndex + 1} / ${v.versions.length}</span>
      <button class="vs-btn" data-vs="next" data-idx="${i}" ${v.currentIndex === v.versions.length - 1 ? 'disabled' : ''} aria-label="Next"><i data-lucide="chevron-right"></i></button>
    </div>` : '';
  return `
    <div class="msg msg-user">
      ${renderFilesInline(files)}
      <div class="bubble">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
      ${switcher}
    </div>`;
}

function renderAssistant(m, i) {
  const prevIdx = i - 1;
  const v = state.versions[prevIdx];
  const content = (v && v.aiReplies[v.currentIndex]) ? v.aiReplies[v.currentIndex] : (m.content || '');
  const files = (v && v.aiFiles[v.currentIndex]) ? v.aiFiles[v.currentIndex] : (m.files || []);
  return `
    <div class="msg msg-assistant">
      <div class="avatar"><img src="/av.png" alt="DeepRWA" /></div>
      <div class="assistant-body">
        <div class="assistant-name">DeepRWA</div>
        <div class="assistant-text">${content ? renderMarkdown(content) : ''}</div>
        ${renderFilesInline(files)}
      </div>
    </div>`;
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-vs]');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx);
  const dir = btn.dataset.vs;
  const v = state.versions[idx];
  if (!v) return;
  const newIdx = dir === 'prev' ? Math.max(0, v.currentIndex - 1) : Math.min(v.versions.length - 1, v.currentIndex + 1);
  if (newIdx === v.currentIndex) return;
  v.currentIndex = newIdx;
  state.messages[idx].content = v.versions[newIdx];
  state.messages[idx].files = v.versionFiles[newIdx];
  if (state.messages[idx + 1] && state.messages[idx + 1].role === 'assistant') {
    state.messages[idx + 1].content = v.aiReplies[newIdx];
    state.messages[idx + 1].files = v.aiFiles[newIdx];
  }
  render();
});

load();
</script>
</body>
</html>
