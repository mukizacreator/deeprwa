<!DOCTYPE html>

<head>

<meta name="description" content="DeepRWA is an AI assistant specialised in everything about Rwanda." />

<meta property="og:title" content="DeepRWA — Your AI Guide to Rwanda" />
<meta property="og:description" content="Ask anything about Rwanda. Get professional answers in your language." />

<link rel="apple-touch-icon" href="/av.png" />
<link rel="manifest" href="/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css?v=4.3.0" />
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <img src="/av.png" alt="DeepRWA" class="brand-logo" />
        <span class="brand-name"><span class="b-deep">Deep</span><span class="b-r">R</span><span class="b-w">W</span><span class="b-a">A</span></span>
      </div>
      <button class="icon-btn sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse"><i data-lucide="panel-left-close"></i></button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <i data-lucide="square-pen"></i><span>New chat</span>
    </button>

    <nav class="sidebar-nav" id="sidebarNav">
      <button class="nav-item active" data-view="chats"><i data-lucide="message-square"></i><span>Chats</span></button>
      <button class="nav-item" data-view="files"><i data-lucide="folder"></i><span>Files</span></button>
    </nav>

    <div class="chats-multiselect-bar hidden" id="chatsMultiBar">
      <button class="files-ms-btn" id="chatsSelectAllBtn" aria-label="Select all">
        <i data-lucide="square"></i><span>Select all</span>
      </button>
      <div class="files-ms-right">
        <button class="files-ms-btn" id="chatsPinSelectedBtn" aria-label="Pin selected" title="Pin selected">
          <i data-lucide="pin"></i>
        </button>
        <button class="files-ms-btn danger" id="chatsDeleteSelectedBtn" aria-label="Delete selected">
          <i data-lucide="trash-2"></i><span id="chatsDeleteCountLabel">Delete</span>
        </button>
        <button class="files-ms-btn" id="chatsCancelSelectBtn" aria-label="Cancel">
          <i data-lucide="x"></i>
        </button>
      </div>
    </div>

    <div class="files-multiselect-bar hidden" id="filesMultiBar">
      <button class="files-ms-btn" id="filesSelectAllBtn" aria-label="Select all">
        <i data-lucide="square"></i><span>Select all</span>
      </button>
      <div class="files-ms-right">
        <button class="files-ms-btn danger" id="filesDeleteSelectedBtn" aria-label="Delete selected">
          <i data-lucide="trash-2"></i><span id="filesDeleteCountLabel">Delete</span>
        </button>
        <button class="files-ms-btn" id="filesCancelSelectBtn" aria-label="Cancel">
          <i data-lucide="x"></i>
        </button>
      </div>
    </div>

    <div class="sidebar-content" id="sidebarContent"></div>

    <div class="sidebar-footer" id="sidebarFooter">
      <button class="auth-btn" id="authBtn"><i data-lucide="log-in"></i><span>Log in</span></button>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button>
      <button class="icon-btn expand-btn hidden" id="expandBtn" aria-label="Expand"><i data-lucide="panel-left-open"></i></button>
      <div class="topbar-brand">
        <img src="/av.png" alt="DeepRWA" class="topbar-logo" />
        <span class="brand-name"><span class="b-deep">Deep</span><span class="b-r">R</span><span class="b-w">W</span><span class="b-a">A</span></span>
      </div>
    </header>

    <div id="chat" class="chat" aria-live="polite"></div>

    <div class="composer" id="composerWrap">
      <div class="file-previews" id="filePreviews" hidden></div>
      <form class="composer-inner" id="composer">
        <button type="button" class="attach-btn" id="attachBtn" aria-label="Attach"><i data-lucide="paperclip"></i></button>
        <input type="file" id="fileInput" multiple hidden accept="image/*,application/pdf,text/*,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.md,.csv,.json" />
        <textarea id="input" rows="1" placeholder="Ask anything about Rwanda…" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="send"></textarea>
        <div class="voice-status hidden" id="voiceStatus" aria-live="polite">
          <span class="voice-indicator"><span class="voice-dot"></span><span class="voice-dot"></span><span class="voice-dot"></span></span>
          <span class="voice-label" id="voiceLabel">Listening…</span>
        </div>
        <button type="button" class="mic-btn" id="micBtn" aria-label="Dictate" title="Dictate"><i data-lucide="mic"></i></button>
        <button type="button" class="send-btn" id="sendBtn" aria-label="Send" title="Send">
  <i data-lucide="arrow-up" class="icon-send"></i>
  <i data-lucide="square" class="icon-stop hidden"></i>
  <svg class="icon-voice hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 10v4"/>
    <path d="M6 6v12"/>
    <path d="M10 3v18"/>
    <path d="M14 8v8"/>
    <path d="M18 5v14"/>
    <path d="M22 11v2"/>
  </svg>
  <i data-lucide="x" class="icon-exit hidden"></i>
</button>
      </form>
      <p class="composer-disclaimer">DeepRWA — Check important information.</p>
    </div>
  </main>
</div>

<div class="modal-backdrop hidden" id="authModal">
  <div class="modal">
    <button class="modal-close" id="authModalClose"><i data-lucide="x"></i></button>
    <div class="modal-body" id="authModalBody"></div>
  </div>
</div>

<div class="modal-backdrop hidden" id="profileModal">
  <div class="modal">
    <button class="modal-close" id="profileModalClose"><i data-lucide="x"></i></button>
    <div class="modal-body" id="profileModalBody"></div>
  </div>
</div>

<div class="modal-backdrop hidden" id="settingsModal">
  <div class="modal modal-settings">
    <button class="modal-close" id="settingsModalClose"><i data-lucide="x"></i></button>
    <div class="settings-layout">
      <nav class="settings-sidebar" id="settingsSidebar">
        <button class="settings-tab active" data-tab="account"><i data-lucide="settings"></i><span>Account</span></button>
        <button class="settings-tab" data-tab="security"><i data-lucide="shield"></i><span>Security</span></button>
        <button class="settings-tab" data-tab="sessions"><i data-lucide="monitor"></i><span>Sessions</span></button>
      </nav>
      <div class="settings-content" id="settingsContent"></div>
    </div>
  </div>
</div>

<div class="dropdown hidden" id="accountDropdown">
  <button data-action="profile"><i data-lucide="user"></i><span>Profile</span></button>
  <button data-action="settings"><i data-lucide="settings"></i><span>Settings</span></button>
  <div class="dropdown-divider"></div>
  <button data-action="logout" class="danger"><i data-lucide="log-out"></i><span>Log out</span></button>
</div>

<div class="modal-backdrop hidden" id="shareModal">
  <div class="modal">
    <button class="modal-close" id="shareModalClose"><i data-lucide="x"></i></button>
    <div class="modal-body">
      <h3>Share</h3>
      <p class="modal-sub">Anyone with this link can view the content.</p>
      <div class="share-link-row">
        <input type="text" id="shareLinkInput" readonly />
        <button class="btn-primary" id="copyShareLink">Copy</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="renameModal">
  <div class="modal">
    <button class="modal-close" id="renameModalClose"><i data-lucide="x"></i></button>
    <div class="modal-body">
      <h3>Rename chat</h3>
      <input type="text" id="renameInput" class="modal-input" />
      <button class="btn-primary" id="renameSubmit">Save</button>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="confirmModal">
  <div class="modal">
    <div class="modal-body">
      <h3 id="confirmTitle">Are you sure?</h3>
      <p class="modal-sub" id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn-secondary" id="confirmCancel">Cancel</button>
        <button class="btn-danger" id="confirmOk">Confirm</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="fileViewModal">
  <div class="modal modal-file-view">
    <button class="modal-close" id="fileViewModalClose"><i data-lucide="x"></i></button>
    <div class="file-view-body" id="fileViewBody"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="/main.js?v=4.4.0"></script>
</body>
</html>
