<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DeepRWA — Your AI Guide to Rwanda</title>
<meta name="description" content="DeepRWA is an AI assistant specialised in everything about Rwanda. Ask in any language." />
<meta name="theme-color" content="#000000" />
<meta property="og:title" content="DeepRWA — Your AI Guide to Rwanda" />
<meta property="og:description" content="Ask anything about Rwanda. Get professional answers in your language." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://deeprwa.agentdomains.co/" />
<meta property="og:image" content="https://deeprwa.agentdomains.co/av.png" />
<link rel="icon" href="/av.png" type="image/png" />
<link rel="apple-touch-icon" href="/av.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"SoftwareApplication","name":"DeepRWA","applicationCategory":"AIApplication","operatingSystem":"Any","url":"https://deeprwa.agentdomains.co/","image":"https://deeprwa.agentdomains.co/av.png","author":{"@type":"Person","name":"Emmanuel Mukiza"}}
</script>
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <img src="/av.png" alt="DeepRWA" class="brand-logo" />
        <span class="brand-name"><span class="b-deep">Deep</span><span class="b-r">R</span><span class="b-w">W</span><span class="b-a">A</span></span>
      </div>
      <button class="icon-btn sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse">
        <i data-lucide="panel-left-close"></i>
      </button>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close">
        <i data-lucide="x"></i>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <i data-lucide="square-pen"></i>
      <span>New chat</span>
    </button>

    <nav class="sidebar-nav" id="sidebarNav">
      <button class="nav-item active" data-view="chats">
        <i data-lucide="message-square"></i><span>Chats</span>
      </button>
      <button class="nav-item" data-view="images">
        <i data-lucide="image"></i><span>Images</span>
      </button>
    </nav>

    <div class="sidebar-content" id="sidebarContent"></div>

    <div class="sidebar-footer">
      <button class="auth-btn" id="loginBtn">
        <i data-lucide="log-in"></i><span>Log in</span>
      </button>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button>
      <button class="icon-btn expand-btn hidden" id="expandBtn" aria-label="Expand"><i data-lucide="panel-left-open"></i></button>
      <div class="topbar-brand">
        <img src="/av.png" alt="DeepRWA" class="topbar-logo" />
        <span class="brand-name"><span class="b-deep">Deep</span><span class="b-r">R</span><span class="b-w">W</span><span class="b-a">A</span></span>
      </div>
    </header>

    <div id="chat" class="chat" aria-live="polite"></div>

    <div class="composer" id="composerWrap">
      <div class="file-previews" id="filePreviews" hidden></div>
      <form class="composer-inner" id="composer">
        <button type="button" class="attach-btn" id="attachBtn" aria-label="Attach">
          <i data-lucide="paperclip"></i>
        </button>
        <input type="file" id="fileInput" multiple hidden accept="image/*,.pdf,.txt,.doc,.docx,.md" />
        <textarea id="input" rows="1" placeholder="Ask anything about Rwanda…" autocomplete="off"></textarea>
        <button type="button" class="send-btn" id="sendBtn" disabled aria-label="Send">
          <i data-lucide="arrow-up" class="icon-send"></i>
          <i data-lucide="square" class="icon-stop hidden"></i>
        </button>
      </form>
    </div>
  </main>
</div>

<!-- AUTH MODAL -->
<div class="modal-backdrop hidden" id="authModal">
  <div class="modal">
    <button class="modal-close" id="authModalClose"><i data-lucide="x"></i></button>
    <div class="modal-body" id="authModalBody"></div>
  </div>
</div>

<!-- SHARE MODAL -->
<div class="modal-backdrop hidden" id="shareModal">
  <div class="modal">
    <button class="modal-close" id="shareModalClose"><i data-lucide="x"></i></button>
    <div class="modal-body">
      <h3>Share</h3>
      <p class="modal-sub">Anyone with this link can view the content.</p>
      <div class="share-link-row">
        <input type="text" id="shareLinkInput" readonly />
        <button class="btn-primary" id="copyShareLink">Copy</button>
      </div>
    </div>
  </div>
</div>

<!-- RENAME MODAL -->
<div class="modal-backdrop hidden" id="renameModal">
  <div class="modal">
    <button class="modal-close" id="renameModalClose"><i data-lucide="x"></i></button>
    <div class="modal-body">
      <h3>Rename chat</h3>
      <input type="text" id="renameInput" class="modal-input" />
      <button class="btn-primary" id="renameSubmit">Save</button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-backdrop hidden" id="confirmModal">
  <div class="modal">
    <div class="modal-body">
      <h3 id="confirmTitle">Are you sure?</h3>
      <p class="modal-sub" id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn-secondary" id="confirmCancel">Cancel</button>
        <button class="btn-danger" id="confirmOk">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="/main.js"></script>
</body>
</html>
